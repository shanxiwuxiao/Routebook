[project]
name = "routebook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shanxiwuxiao", email = "wx1342430428@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
routebook = "routebook:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # unused arguments
    "SIM",    # flake8-simplify
    "RUF",    # ruff 自身规则
    "ASYNC",  # flake8-async  ← 对 async 项目特别重要
]
ignore = [
    "E501",   # 行长由 formatter 处理
    "B008",   # FastAPI 的 Depends() 必须写在默认值里
    # 本项目注释与文档字符串用中文，全角标点（：，、（））是刻意为之，
    # 不是"看起来像 ASCII 的错别字"。这三条规则对 CJK 项目只会制造噪音。
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]     # 测试里允许不用参数、允许 assert

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: 慢测试",
    "integration: 需要真实依赖（数据库等）",
]
